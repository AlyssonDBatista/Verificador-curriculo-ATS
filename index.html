<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificador ATS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: painel de envio à esquerda, resultado à direita; empilha no celular. */
:root{
  --bg:#f4f7f8; --surface:#ffffff; --ink:#15252c; --muted:#58696f; --line:#d9e3e7;
  --accent:#00879e; --accent-soft:#e0f3f6; --accent-ink:#ffffff;
  --good:#17825a; --good-soft:#e2f4ec; --warn:#a96a0a; --warn-soft:#fbf0dc; --bad:#bb3a2c; --bad-soft:#fbe6e3;
  --font-display:'Rubik',system-ui,sans-serif; --font-body:'IBM Plex Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a1f; --surface:#17262d; --ink:#e6eff2; --muted:#9db0b7; --line:#2a3d46;
    --accent:#3cc3da; --accent-soft:#143841; --accent-ink:#06222a;
    --good:#4cc795; --good-soft:#12352a; --warn:#e7b04d; --warn-soft:#3a2d12; --bad:#f0857a; --bad-soft:#3d1c19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17262d; --ink:#e6eff2; --muted:#9db0b7; --line:#2a3d46;
  --accent:#3cc3da; --accent-soft:#143841; --accent-ink:#06222a;
  --good:#4cc795; --good-soft:#12352a; --warn:#e7b04d; --warn-soft:#3a2d12; --bad:#f0857a; --bad-soft:#3d1c19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
header h1{font-size:26px;letter-spacing:.2px}
header p{margin:4px 0 0;color:var(--muted);max-width:56ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.step{display:flex;flex-direction:column;gap:8px}
.step h2{font-size:15px;display:flex;gap:8px;align-items:center}
.step h2 b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:1.5px dashed var(--line);border-radius:10px;padding:22px 12px;cursor:pointer;background:var(--bg);transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop strong{font-weight:500}
.drop small{color:var(--muted)}
.file{display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.file.on{display:flex}
.file span{overflow-wrap:anywhere}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:13px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:500;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:13.5px;margin:0}
/* resultado */
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:520px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--font-display);font-size:34px;font-weight:500;line-height:1}
.ring .num small{font-size:12px;color:var(--muted);font-family:var(--font-body);margin-top:4px}
.verdict h2{font-size:20px}
.verdict p{margin:4px 0 12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px;width:100%}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13.5px;text-align:left}
@media (max-width:520px){.bar{grid-template-columns:110px 1fr 36px}}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;border-radius:4px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:17px}
.count{color:var(--muted);font-size:13px}
.checks{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.check{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-left-width:4px;border-radius:10px}
.check.fail{border-left-color:var(--bad)} .check.warn{border-left-color:var(--warn)} .check.pass{border-left-color:var(--good)} .check.info{border-left-color:var(--muted)}
.pill{align-self:start;font-size:11.5px;font-weight:600;letter-spacing:.3px;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.fail .pill{background:var(--bad-soft);color:var(--bad)} .warn .pill{background:var(--warn-soft);color:var(--warn)} .pass .pill{background:var(--good-soft);color:var(--good)} .info .pill{background:var(--line);color:var(--muted)}
.check h3{font-size:15px}
.check p{margin:2px 0 0;color:var(--muted);font-size:14px}
.check .fix{margin-top:6px;color:var(--ink);font-size:14px}
.check .fix b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:999px;font-size:13px;border:1px solid transparent}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.no{background:var(--warn-soft);color:var(--warn)}
.kw-h{font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:500}
.kw-h:first-of-type{margin-top:0}
details summary{cursor:pointer;font-weight:500}
pre.raw{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto;font-size:12.5px;margin:10px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.empty ul{margin:10px 0 0;padding-left:18px;color:var(--muted)}
.empty li{margin:3px 0}
.demo-tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:8px;vertical-align:middle}
/* IA */
.ai-block{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.ai-block h3{font-size:14.5px;margin-bottom:6px}
.ai-block p{margin:0 0 6px}
.ai-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:640px){.ai-pair{grid-template-columns:1fr}}
.ai-pair div{padding:8px 10px;border-radius:8px;font-size:14px}
.ai-pair .before{background:var(--bad-soft)} .ai-pair .after{background:var(--good-soft)}
.ai-pair small{display:block;font-weight:600;margin-bottom:2px;opacity:.8}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.drop{transition:none}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
.market{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.tpl-grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.tpl-grid{grid-template-columns:1fr}}
.tips{margin:0;padding-left:18px;color:var(--ink);font-size:14px}.tips li{margin:4px 0}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 30px;font:13px/1.45 Arial,Helvetica,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.paper h4{margin:14px 0 6px;font:700 12px Arial,sans-serif;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid #999;padding-bottom:2px}
.paper .nm{font:700 22px Arial,sans-serif;margin:0}.paper .hl{font-size:14px;margin:2px 0}.paper .ct{font-size:12px;color:#333;margin:2px 0 4px}
.paper .rl{display:flex;justify-content:space-between;gap:10px;margin-top:8px}.paper .rl b{font-weight:700}.paper .rl span{white-space:nowrap}
.paper .og{color:#333}.paper ul{margin:3px 0 0;padding-left:18px}.paper p{margin:3px 0}
.paper mark{background:#fff3b0;color:inherit;padding:0 1px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.sug-sc{display:flex;gap:16px;align-items:center}
.sug-sc div{text-align:center}.sug-sc b{display:block;font-size:30px;line-height:1.1}.sug-sc small{color:var(--muted);font-size:12px}
.sug-arrow{font-size:22px;color:var(--muted)}
.kwsel label{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:14px;cursor:pointer}
.sug-list{margin:0;padding-left:18px;font-size:14px}.sug-list li{margin:4px 0}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="t-title">Verificador ATS</h1>
      <p id="t-sub"></p>
    </div>
    <div class="seg" role="group" aria-label="Idioma / Language">
      <button type="button" id="lang-pt" aria-pressed="true">Português</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-check" aria-selected="true"></button>
    <button type="button" role="tab" id="tab-tpl" aria-selected="false"></button>
    <button type="button" role="tab" id="tab-sug" aria-selected="false"></button>
  </div>

  <div class="grid" id="view-check">
    <aside class="card stack" aria-label="Entrada">
      <div class="step">
        <h2><b>1</b><span id="t-s1"></span></h2>
        <label class="drop" id="drop" for="file">
          <input type="file" id="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
          <strong id="t-drop1"></strong>
          <small id="t-drop2"></small>
        </label>
        <div class="file" id="filechip"><span id="filename"></span><button type="button" class="link" id="fileclear"></button></div>
        <p class="err hidden" id="err" role="alert"></p>
      </div>
      <div class="step">
        <h2><b>2</b><span id="t-s2"></span> <span class="opt" id="t-opt"></span></h2>
        <label for="job" class="note" id="t-joblabel"></label>
        <textarea id="job"></textarea>
      </div>
      <div class="step">
        <h2><b>3</b><span id="t-s3"></span> <span class="opt" id="t-opt3"></span></h2>
        <label for="seg" class="hidden" id="t-seglabel"></label>
        <select id="seg"></select>
        <p class="note"><span class="market" id="market"></span> <span id="t-marketnote"></span></p>
      </div>
      <button type="button" class="btn" id="go" disabled></button>
      <button type="button" class="link" id="demo"></button>
      <p class="note" id="t-priv"></p>
    </aside>

    <main id="out" aria-live="polite"></main>
  </div>

  <div class="tpl-grid hidden" id="view-tpl">
    <aside class="card stack" aria-label="Modelos">
      <div class="step">
        <h2 id="t-tplh"></h2>
        <label for="tseg" class="note" id="t-tseglabel"></label>
        <select id="tseg"></select>
        <p class="note"><span class="market" id="tmarket"></span> <span id="t-tmarketnote"></span></p>
      </div>
      <div class="btn-row"><button type="button" class="btn" id="tpl-dl"></button><button type="button" class="btn ghost" id="tpl-copy"></button></div>
      <p class="err hidden" id="tpl-msg" role="status"></p>
      <div class="step"><h2 id="t-tipsh"></h2><ul class="tips" id="tips"></ul></div>
    </aside>
    <main><div class="paper" id="paper" aria-label="Preview"></div></main>
  </div>

  <div class="tpl-grid hidden" id="view-sug">
    <aside class="card stack" aria-label="Sugestão">
      <div id="sug-side" class="stack"></div>
      <div class="btn-row"><button type="button" class="btn" id="sug-dl"></button><button type="button" class="btn ghost" id="sug-copy"></button></div>
      <p class="err hidden" id="sug-msg" role="status"></p>
    </aside>
    <main><div class="paper" id="sug-paper" aria-label="Preview"></div></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

function pdfGutter(items,W,H){
  const body=items.filter(i=>i.y<H*0.84&&i.str.trim().length>0);
  const len=a=>a.reduce((n,i)=>n+i.str.trim().length,0);
  const total=len(body);
  if(body.length<20||total<200) return false;
  let start=null,best=null;
  const keep=x=>{ if(x-start>=12&&(!best||x-start>best[1]-best[0])) best=[start,x]; };
  const x1=Math.round(W*0.78);
  for(let x=Math.round(W*0.22);x<=x1;x++){
    const covered=body.some(i=>i.x<x&&i.x+i.w>x);
    if(!covered){ if(start===null) start=x; } else if(start!==null){ keep(x); start=null; }
  }
  if(start!==null) keep(x1);
  if(!best) return false;
  const L=body.filter(i=>i.x+i.w<=best[0]+1), R=body.filter(i=>i.x>=best[1]-1);
  if(L.length<8||R.length<8||len(R)<120||len(L)<120) return false;
  // a real column starts many lines at the same left edge; right-aligned dates do not
  const starts={}; R.forEach(i=>{const k=Math.round(i.x/2); starts[k]=(starts[k]||0)+1;});
  const lines=new Set(R.map(i=>Math.round(i.y/3)));
  return Math.max(...Object.values(starts))>=5&&lines.size>=6&&Math.min(len(L),len(R))/total>=0.04;
}
/* Junta os trechos de texto do PDF como um leitor simples faria, sem inserir espaço dentro de palavras. */
function pdfPageText(items){
  const lines=[],cells=[]; let line="",seg="",prev=null;
  const endSeg=()=>{ if(seg.trim()) cells.push(seg.trim()); seg=""; };
  const endLine=()=>{ if(line.trim()) lines.push(line.trim()); line=""; };
  items.forEach(i=>{
    const sz=i.h||10;
    if(prev){
      const newLine=Math.abs(i.y-prev.y)>sz*0.6;
      const gap=i.x-(prev.x+prev.w);
      if(newLine){ endSeg(); endLine(); }
      else if(gap>sz*1.2){ endSeg(); line+="  "; }
      else if(gap>sz*0.12&&!/\s$/.test(line)&&!/^\s/.test(i.str)){ seg+=" "; line+=" "; }
    }
    seg+=i.str; line+=i.str;
    if(i.str.trim()) prev=i;
    if(i.eol){ endSeg(); endLine(); prev=null; }
  });
  endSeg(); endLine();
  return {lines,cells};
}

function extractKeywords(job){
  const orig=job, n=norm(job);
  const terms=new Map();
  const claimed=new Set();
  SKILLS.slice().sort((a,b)=>b.length-a.length).forEach(s=>{
    const re=new RegExp("(?<![a-z0-9])"+esc(s)+"(?![a-z0-9])","g");
    const m=n.match(re);
    if(m&&!terms.has(s)){
      const idx=n.search(re), shownTxt=orig.slice(idx,idx+s.length);
      terms.set(s,{term:s,weight:4+m.length,display:norm(shownTxt)===s?shownTxt:s});
      s.split(" ").forEach(p=>claimed.add(p));
    }
  });
  const counts=new Map(), shown=new Map();
  (orig.match(/[A-Za-zÀ-ÿ0-9+#.&]+/g)||[]).forEach(raw=>{
    const w=raw.replace(/^[.&]+|[.&]+$/g,""); if(!w) return;
    const k=norm(w);
    if(k.length<3&&!/^[A-Z]{2,}$/.test(w)) return;
    if(STOP.has(k)||/^\d+$/.test(k)||claimed.has(k)||terms.has(k)) return;
    counts.set(k,(counts.get(k)||0)+1); if(!shown.has(k)) shown.set(k,w);
  });
  counts.forEach((c,k)=>{
    const acr=/^[A-Z]{2,6}$/.test(shown.get(k));
    if(c>=2||acr) terms.set(k,{term:k,weight:(acr?3:0)+c});
  });
  const list=[...terms.values()].sort((a,b)=>b.weight-a.weight).slice(0,30);
  list.forEach(t=>{ t.display=t.display||shown.get(t.term)||t.term; });
  return list;
}

  Object.entries(SECTIONS).forEach(([k,s])=>{ found[k]=[...cand].some(c=>s.re.test(c)); (found[k]?foundNames:missing).push(s.label); });
  const sc=foundNames.length;
  add("sections",15,sc===4?"pass":sc===3?"warn":"fail",B("Seções padrão","Standard sections"),

  const email=/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/.test(text);

  const pua=(text.match(PUA_RE)||[]).length, odd=(text.match(ODD_RE)||[]).length;
  add("glyphs",5,pua+odd===0?"pass":"warn",B("Ícones e símbolos","Icons and symbols"),

   [/referencias (disponiveis|sob)|references (available|upon)/,B("“referências disponíveis”","“references available”"),0]
  ].filter(p=>p[0].test(n));
  const sens=PERS.some(p=>p[2]);
  add("personal",5,PERS.length===0?"pass":(intl&&sens)?"fail":"warn",
    B("Dados pessoais desnecessários","Unnecessary personal data"),
    PERS.length===0?B("Não encontrei dados pessoais que não precisam estar no currículo.","No personal data found that doesn't belong on a resume.")
      :B(`Encontrei: ${PERS.map(p=>p[1].pt).join(", ")}.`,`Found: ${PERS.map(p=>p[1].en).join(", ")}.`),
    PERS.length===0?null:intl
      ?B("Em currículos para o exterior, deixe de fora idade, data de nascimento, estado civil, foto, CPF e endereço completo. Empresas evitam esses dados por regras antidiscriminação. Basta cidade e estado ou país.","On resumes for international jobs, leave out age, date of birth, marital status, photo, national ID and full street address. Employers avoid this data because of anti-discrimination rules. City and state or country are enough.")
      :B("CPF e RG não ajudam na triagem e expõem seus dados; evite também o endereço completo, porque bairro, cidade e estado bastam. Idade e estado civil só se a vaga pedir.","Age, marital status and national ID don't help screening and expose your data. Include them only if the job asks, and prefer just city and state for the address."));

  // linkedin
  const li=/linkedin\.com\/in\//.test(n);
  add("linkedin",3,li?"pass":"warn",B("Link do LinkedIn","LinkedIn link"),

    li?null:B("Inclua o endereço do perfil, como texto, na linha de contato.","Add your profile URL as plain text in the contact line."));

  // segmento
  const has=re=>re.test(n);
  const cnt=re=>new Set(n.match(new RegExp(re.source,"g"))||[]).size;
  const rule=(id,w,ok,title,okD,badD,fix,bad="warn")=>add(id,w,ok?"pass":bad,title,ok?okD:badD,ok?null:fix);
  if(seg==="ti"){
    rule("s-link",8,has(/github\.com|gitlab\.com|bitbucket\.org|portfolio|kaggle\.com|stackoverflow\.com|medium\.com|dev\.to|\.dev\b|\.io\b/),

    rule("s-cert",5,has(/certifica|certified|\b(aws|azure|gcp|pmp|csm|psm|itil|comptia|cissp|microsoft|google cloud|scrum master)\b/),
      B("Certificações","Certifications"),B("Certificações ou cursos técnicos encontrados.","Certifications or technical courses found."),
      B("Nenhuma certificação citada.","No certifications mentioned."),
      B("Liste certificações e cursos (AWS, Azure, Microsoft, Scrum, etc.) com emissor e ano.","List certifications and courses (AWS, Azure, Microsoft, Scrum, etc.) with issuer and year."));
    const tech=cnt(/\b(python|sql|java|javascript|typescript|c#|\.net|react|node|power bi|tableau|aws|azure|gcp|docker|kubernetes|git|linux|etl|spark|pandas|php|golang|kotlin|swift|angular|vue)\b/);
    rule("s-stack",6,tech>=4,B("Tecnologias citadas","Technologies listed"),B(`${tech} tecnologias reconhecidas.`,`${tech} technologies recognized.`),
      B(`Só ${tech} tecnologia(s) reconhecida(s).`,`Only ${tech} technology term(s) recognized.`),
      B("Liste a stack completa, agrupada por tipo (linguagens, bancos de dados, nuvem, ferramentas), e repita as principais dentro das experiências.","List your full stack, grouped by type (languages, databases, cloud, tools), and repeat the main ones inside your experience bullets."));
  }
  if(seg==="saude"){
    rule("s-reg",12,intl?has(/license|licence|licensed|\brph\b|pharmd|\bnpi\b|board.certified|nclex|registered (nurse|pharmacist)|\bgphc\b|\bgmc\b|\bnmc\b/)
                        :has(/\b(crf|crm|coren|crn|crefito|crp|cro|crbm|crbio|cref)\b[\s\-\/]*([a-z]{2})?[\s\-:\/]*\d{3,}/),
      B("Registro profissional","Professional license"),
      B("Registro ou licença encontrado.","License or registration found."),
      B("Nenhum registro profissional com número.","No professional license with a number."),
      intl?B("Coloque a licença com estado e número no topo e no resumo, por exemplo “PharmD, RPh (Estado #12345)”. Muitos filtros procuram por ela.","Put the license with state and number at the top and in the summary, for example “PharmD, RPh (State #12345)”. Many filters search for it.")
          :B("Coloque o registro com UF e número no topo e no resumo, por exemplo “CRF-SP 12345”. É requisito legal e muitos filtros procuram por ele.","Put your registration with state and number at the top and in the summary, for example “CRF-SP 12345”. It is a legal requirement and many filters search for it."),"fail");
    rule("s-norm",6,cnt(intl?/\b(fda|gmp|gxp|hipaa|joint commission|usp|dea|pharmacovigilance|cgmp)\b/:/\b(anvisa|rdc|bpf|gmp|vigilancia sanitaria|portaria 344|sngpc|farmacovigilancia)\b/)>=1,
      B("Normas e regulatório","Regulations and standards"),B("Normas do setor citadas.","Industry standards mentioned."),B("Nenhuma norma do setor citada.","No industry standards mentioned."),
      intl?B("Cite as normas com que você trabalha (FDA, GMP, HIPAA, Joint Commission, USP).","Name the standards you work with (FDA, GMP, HIPAA, Joint Commission, USP)."):B("Cite as normas com que você trabalha (ANVISA, RDC, BPF, Portaria 344, SNGPC).","Name the standards you work with (ANVISA, RDC, GMP, Portaria 344, SNGPC)."));
    rule("s-spec",4,has(/especializa|residencia|pos-?gradua|\bmba\b|mestrado|doutorado|residency|fellowship|\bmaster|\bphd\b|board/),
      B("Especializações","Specializations"),B("Pós-graduação, residência ou especialização encontrada.","Postgraduate study, residency or specialization found."),B("Nenhuma especialização citada.","No specialization mentioned."),
      B("Inclua residência, especializações e cursos de atualização com instituição e ano.","Include residencies, specializations and continuing-education courses with institution and year."));
  }
  if(seg==="arq"){
    rule("s-reg",10,intl?has(/licensed architect|registered architect|ncarb|\briba\b|\barb\b|professional engineer|\bp\.?e\.?\b|\bleed\b|\bare\b/)
                        :has(/\b(cau|crea)\b[\s\-\/]*([a-z]{2})?[\s\-:\/]*[a-z]?\d{3,}/),
      B("Registro profissional","Professional license"),B("Registro ou licença encontrado.","License or registration found."),B("Nenhum registro com número.","No license with a number."),
      intl?B("Informe licença ou certificações (licensed architect, NCARB, RIBA, LEED) com número ou estado. Se ainda não tem, escreva “em processo”.","State your license or credentials (licensed architect, NCARB, RIBA, LEED) with number or state. If you don't have one yet, write “in progress”.")

    const sw=cnt(/\b(autocad|revit|sketchup|archicad|bim|lumion|rhino|v-?ray|enscape|twinmotion|civil 3d|navisworks|grasshopper|solidworks|ansys|sap2000|tekla|etabs|qgis|cype|eberick|autodesk)\b/);
    rule("s-sw",8,sw>=2,B("Softwares de projeto","Design software"),B(`${sw} softwares reconhecidos.`,`${sw} software tools recognized.`),

      B("Liste os softwares com que você trabalha (AutoCAD, Revit, SketchUp, Lumion, BIM) e cite-os também nas experiências.","List the software you use (AutoCAD, Revit, SketchUp, Lumion, BIM) and mention them in your experience too."));
    rule("s-port",8,has(/behance|issuu|archdaily|portfolio|drive\.google|dribbble|instagram|pinterest|\.com\/[a-z0-9_-]*portfolio/),

  }
  if(seg==="fin"){
    const sys=cnt(/\b(sap|totvs|protheus|oracle|omie|netsuite|quickbooks|sage|dynamics|hyperion|alterdata|conta azul|excel|power bi|tableau|sql)\b/);
    rule("s-sys",8,sys>=2,B("Sistemas e ferramentas","Systems and tools"),B(`${sys} sistemas ou ferramentas reconhecidos.`,`${sys} systems or tools recognized.`),
      B(`Só ${sys} sistema(s) reconhecido(s).`,`Only ${sys} system(s) recognized.`),
      B("Liste os ERPs e ferramentas (SAP, TOTVS, Excel avançado, Power BI) e cite-os também nas experiências.","List the ERPs and tools (SAP, TOTVS, advanced Excel, Power BI) and mention them in your experience too."));
    const nr=cnt(intl?/\b(gaap|ifrs|sox|audit|compliance|reconciliation|month-end|forecast|fp&a|budget)\b/:/\b(ifrs|cpc|sox|sped|ecd|ecf|lgpd|auditoria|compliance|conciliacao|fechamento|orcamento|forecast)\b/);

  }

  // tipo de arquivo (informativo)
  if(doc.kind==="pdf") add("filetype",0,"info",B("Tipo de arquivo","File type"),
    intl?B("PDF com texto selecionável. Siga a instrução da vaga; se não houver, o .docx é a escolha mais segura.","PDF with selectable text. Follow the posting's instructions; if there are none, .docx is the safest choice.")
        :B("PDF com texto selecionável. A Gupy aceita PDF, mas recomenda .doc ou .docx quando possível.","PDF with selectable text. Gupy accepts PDF but recommends .doc or .docx when possible."),null);

  // pontuação
  const val={pass:1,warn:0.5,fail:0};
  const scored=checks.filter(c=>c.status!=="info");
  const ws=scored.reduce((n,c)=>n+c.weight,0);
  const fmt=Math.round(100*scored.reduce((n,c)=>n+c.weight*val[c.status],0)/ws);

  // vaga
  let kw=null;
  if(job&&job.trim().length>40){
    const list=extractKeywords(job);
    list.forEach(t=>{ t.found=hasTerm(n,t.term); });
    const tw=list.reduce((a,t)=>a+t.weight,0)||1, fw=list.filter(t=>t.found).reduce((a,t)=>a+t.weight,0);
    kw={list,pct:Math.round(100*fw/tw)};
  }
  const overall=kw?Math.round(fmt*0.65+kw.pct*0.35):fmt;
  return {checks,fmt,kw,overall,words,text};
}

/* ================= Leitura de arquivos ================= */
async function readPdf(buf){
  if(!window.pdfjsLib) throw new Error("lib");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const maxP=Math.min(pdf.numPages,5);
  let text="",cells=[],lines=[],cols=false,images=0,sizeChars=[];
  for(let p=1;p<=maxP;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:1});
    const tc=await page.getTextContent();
    const items=tc.items.filter(i=>typeof i.str==="string").map(i=>({str:i.str,x:i.transform[4],y:i.transform[5],w:i.width,h:Math.hypot(i.transform[2],i.transform[3]),eol:i.hasEOL}));
    const pt=pdfPageText(items);
    cells.push(...pt.cells); lines.push(...pt.lines); text+=pt.lines.join("\n")+"\n\n";
    items.forEach(i=>{ const q=i.str.trim(); if(q&&i.h>0) sizeChars.push([i.h,q.length]); });
    if(pdfGutter(items,vp.width,vp.height)) cols=true;
    if(p<=3){ try{
      const ops=await page.getOperatorList(), O=pdfjsLib.OPS;
      ops.fnArray.forEach(f=>{ if(f===O.paintImageXObject||f===O.paintInlineImageXObject||f===O.paintJpegXObject) images++; });
    }catch(e){} }
  }
  let fs=null;
  if(sizeChars.length){
    sizeChars.sort((a,b)=>a[0]-b[0]); const tot=sizeChars.reduce((n,x)=>n+x[1],0); let acc=0;
    for(const [h,c] of sizeChars){ acc+=c; if(acc>=tot/2){ fs=h; break; } }
  }
  return {text:text.trim(),cells,lines,cols,tables:null,tableShare:0,images,pages:pdf.numPages,fontSize:fs,liCount:0,kind:"pdf"};
}
async function readDocx(buf){
  if(!window.mammoth) throw new Error("lib");
  const r=await mammoth.convertToHtml({arrayBuffer:buf});
  const dom=new DOMParser().parseFromString(r.value,"text/html");
  const rich=[...dom.body.querySelectorAll("p,h1,h2,h3,h4,h5,h6,li")].map(e=>({t:e.textContent.trim(),b:e.tagName==="LI"})).filter(x=>x.t);
  const lines=rich.map(x=>x.t);
  const text=lines.join("\n");
  const tables=[...dom.body.querySelectorAll("table")];
  const tchars=tables.reduce((n,t)=>n+t.textContent.length,0);
  return {text,cells:lines,lines,cols:null,tables:tables.length,tableShare:text.length?tchars/text.length:0,images:dom.body.querySelectorAll("img").length,pages:null,fontSize:null,liCount:dom.body.querySelectorAll("li").length,kind:"docx",rich};
}

  // cabeçalho
  let name="",headline="",contact=[],unplaced=[],removed=[];
  (secs.header||[]).forEach(({t})=>{
    const parts=(EMAIL_RE.test(t)||PHONE_RE.test(t)||URL_RE.test(t))?t.replace(/(\S+@\S+\.[A-Za-z]{2,}|https?:\/\/\S+|(?:www\.|linkedin\.com|github\.com)\S*)/g,"  $1  ").split(/\s{2,}|\s*[|·•]\s*/).map(x=>x.trim()).filter(Boolean):[t];
    parts.forEach(x=>{
      if(isPersonal(x)){ removed.push(x); return; }
      if(EMAIL_RE.test(x)||PHONE_RE.test(x)||URL_RE.test(x)){ if(!contact.includes(x)) contact.push(x); return; }
      if(!name){ name=x; return; }
      if(!headline&&x.length<=70){ headline=x; return; }
      if(x.length<=50&&(/,/.test(x)||/[-\/]\s*[A-Z]{2}$/.test(x))){ contact.push(x); return; }
      unplaced.push(x);
    });
  });
  contact=contact.map(fmtPhone);
  const hasMail=contact.some(x=>EMAIL_RE.test(x)), hasPhone=contact.some(x=>PHONE_RE.test(x));
  const missing=[];
  const sh=TPL[l]._shell, g=TPL[l].geral;
  if(!name) name=sh.name;
  if(!headline) headline=g.headline;
  if(!hasPhone) contact.push(l==="pt"?"[Telefone com DDD]":"[Phone number]");
  if(!hasMail) contact.push(l==="pt"?"[e-mail]":"[email]");
  // blocos
  const blocks={};
  const plain=a=>a.map(x=>x.t);
  if(secs.summary&&secs.summary.length) blocks.summary=[{t:"p",x:plain(secs.summary).join(" ")}];
  const skillBlocks=a=>{
    const out=[], bare=[];
    a.forEach(({t})=>{
      t=levelize(t,l,st);
      const m=t.match(/^([^:]{2,40}):\s*(.+)$/);
      if(m){ out.push({t:"kv",k:m[1].trim(),x:m[2].replace(/\s{2,}/g,", ")}); }
      else t.split(/\s{2,}/).forEach(x=>{ x=trimEnds(x); if(x) bare.push(x); });
    });
    if(bare.length) out.unshift({t:"p",x:bare.join(", ")});
    return out;
  };
  if(secs.skills&&secs.skills.length) blocks.skills=skillBlocks(secs.skills);
  if(secs.languages&&secs.languages.length) blocks.languages=[{t:"bullets",items:plain(secs.languages).map(x=>levelize(x,l,st)).map(x=>/:/.test(x)?x:x.replace(/\s{2,}/g,": "))}];
  ["experience","education"].forEach(k=>{
    const a=secs[k]; if(!a||!a.length) return;
    const roles=parseRoles(a,l,st);
    if(k==="education"&&!roles.some(r=>r.dates)) blocks[k]=[{t:"bullets",items:plain(a)}];
    else blocks[k]=roles.map(r=>({t:"role",r}));
  });
  ["courses","projects"].forEach(k=>{
    if(!secs[k]||!secs[k].length) return;
    let it=plain(secs[k]).map(x=>levelize(x,l,st));
    if(k==="courses"&&it.length>=2&&it.length%2===0&&it.every(x=>x.length<=50&&!/[.;]$/.test(x))){ it=it.reduce((o,x,n)=>{ if(n%2) o[o.length-1]+=" – "+x; else o.push(x); return o; },[]); st.paired=true; }
    blocks[k]=[{t:"bullets",items:it}];
  });
  if(picks.length){
    blocks.skills=blocks.skills||[];
    blocks.skills.push({t:"kv",k:H.more,x:picks.join(", ")});
  }
  // seções ausentes
  if(!blocks.summary){ blocks.summary=[{t:"p",x:g.summary}]; missing.push(H.summary); }
  if(!blocks.skills){ blocks.skills=g.skills.map(k=>({t:"kv",k:k[0],x:k[1]})); missing.push(H.skills); }
  if(!blocks.experience){ blocks.experience=[{t:"role",r:g.roles[0]}]; missing.push(H.experience); }
  if(!blocks.education){ blocks.education=[{t:"role",r:{title:sh.eduItem[0],org:sh.eduItem[1],dates:sh.eduItem[2],bullets:[]}}]; missing.push(H.education); }
  const model={name,headline,contact:contact.join(" | "),sections:SUG_ORDER.filter(k=>blocks[k]&&blocks[k].length).map(k=>({h:H[k],blocks:blocks[k]}))};
  // lista de correções
  if(doc.cols===true) A("Duas colunas viraram uma só, lida de cima para baixo.","Two columns became a single column, read top to bottom.");
  if(doc.tables>0) A("Tabelas viraram texto simples.","Tables became plain text.");
  if(contact.length) A("Contato no topo, em texto e numa linha só (nada em cabeçalho, rodapé ou imagem).","Contact details at the top as plain text on one line (nothing in a header, footer or image).");
  if(renamed.length) A("Títulos padronizados: "+renamed.map(r=>`“${r[0]}” → “${r[1]}”`).join("; ")+".","Headings standardized: "+renamed.map(r=>`“${r[0]}” → “${r[1]}”`).join("; ")+".");
  if(st.glyphs>0) A(`Removi ${st.glyphs} ícone(s) e símbolo(s) especial(is).`,`Removed ${st.glyphs} icon(s) and special symbol(s).`);
  if(st.levels>0) A(`Níveis em bolinhas ou barras escritos por extenso (${st.levels}).`,`Dot or bar skill levels written out in words (${st.levels}).`);
  if(removed.length) A(`Tirei dados pessoais desnecessários: ${removed.join("; ")}.`,`Removed unnecessary personal data: ${removed.join("; ")}.`);
  if(st.paired) A("Cursos: nome e instituição juntos na mesma linha.","Courses: name and institution on the same line.");
  if(st.dates>0) A(`Datas no padrão MM/AAAA – MM/AAAA (${st.dates}).`,`Dates in MM/YYYY – MM/YYYY style (${st.dates}).`);
  if(doc.images>0) A("Foto, logotipos e gráficos ficam de fora: o arquivo novo só tem texto.","Photo, logos and graphics are left out: the new file is text only.");
  A("Atividades em tópicos simples e fonte padrão (Arial 10,5 pt).","Duties in plain bullets and a standard font (Arial 10.5 pt).");
  if(missing.length) A(`Criei campos [entre colchetes] em: ${missing.join(", ")}.`,`Added [bracketed] fields in: ${missing.join(", ")}.`);
  const text=tplText(model), tl=text.split("\n");
  const synth={text,cells:tl,lines:tl,cols:false,tables:0,tableShare:0,images:0,pages:null,fontSize:10.5,liCount:tl.filter(x=>x.startsWith("• ")).length,kind:"docx"};
  return {model,changes,unplaced,synth};
}
let sugSel=new Set(), curSug=null;
function renderSug(){
  const t=T(), side=$("sug-side"), L=o=>h(o[lang]);
  $("tab-sug").textContent=t.tabSug; $("sug-dl").textContent=t.sugDl; $("sug-copy").textContent=t.sugCopy;
  $("sug-msg").classList.add("hidden");
  if(!current||!result){
    curSug=null; side.innerHTML=`<div class="step"><h2>${t.sugH}</h2><p class="note">${t.sugNeed}</p></div>`;
    $("sug-paper").innerHTML=""; $("sug-dl").disabled=true; $("sug-copy").disabled=true; return;
  }
  $("sug-dl").disabled=false; $("sug-copy").disabled=false;
  const miss=result.kw?result.kw.list.filter(x=>!x.found):[];
  const picks=miss.filter(x=>sugSel.has(x.term)).map(x=>x.display);
  const s=buildSuggestion(current.doc,lang,picks); curSug=s;
  const after=analyze(s.synth,$("job").value,opts());
  const todo=after.checks.filter(c=>(c.status==="fail"||c.status==="warn")&&c.fix);
  $("sug-paper").innerHTML=tplHtml(s.model);
  side.innerHTML=`
   <div class="step"><h2>${t.sugH}</h2>
    <div class="sug-sc"><div><b style="color:${col(result.overall)}">${result.overall}</b><small>${t.sugOrig}</small></div><span class="sug-arrow" aria-hidden="true">→</span><div><b style="color:${col(after.overall)}">${after.overall}</b><small>${t.sugNew}</small></div></div>
    <p class="note">${t.sugReview}</p></div>
   <div class="step"><h2>${t.sugDone}</h2><ul class="sug-list">${s.changes.map(c=>`<li>${L(c)}</li>`).join("")}</ul></div>
   <div class="step"><h2>${t.sugTodo}</h2>${todo.length?`<ul class="sug-list">${todo.map(c=>`<li><b>${L(c.title)}.</b> ${L(c.fix)}</li>`).join("")}</ul>`:`<p class="note">${t.sugNoTodo}</p>`}</div>
   ${miss.length?`<div class="step kwsel"><h2>${t.sugKwH}</h2><p class="note">${t.sugKwNote}</p>${miss.map(x=>`<label><input type="checkbox" data-kw="${h(x.term)}" ${sugSel.has(x.term)?"checked":""}> ${h(x.display)}</label>`).join("")}</div>`:""}
   ${s.unplaced.length?`<div class="step"><h2>${t.sugUnp}</h2><p class="note">${t.sugUnpNote}</p><ul class="sug-list">${s.unplaced.map(x=>`<li>${h(x)}</li>`).join("")}</ul></div>`:""}`;
}
function sugMsg(m,bad){ const e=$("sug-msg"); e.textContent=m; e.style.color=bad?"var(--bad)":"var(--good)"; e.classList.remove("hidden"); }
async function sugDownload(){
  if(!curSug) return;
  try{
    const blob=await tplDocx(curSug.model);
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=(lang==="pt"?"curriculo-sugerido":"resume-suggested")+".docx";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
    sugMsg(T().sugSaved,false);
  }catch(e){ sugMsg(T().sugFail,true); }
}
async function sugCopy(){ if(!curSug) return; try{ await navigator.clipboard.writeText(tplText(curSug.model)); sugMsg(T().sugCopied,false); }catch(e){ sugMsg(T().sugFail,true); } }

function setLang(l){
  lang=l; document.documentElement.lang=l==="pt"?"pt-BR":"en";
  $("lang-pt").setAttribute("aria-pressed",l==="pt"); $("lang-en").setAttribute("aria-pressed",l==="en");
  const t=T();
  $("t-sub").textContent=t.sub; $("t-s1").textContent=t.s1; $("t-s2").textContent=t.s2; $("t-opt").textContent=t.opt;
  $("t-joblabel").textContent=t.jobLabel; $("job").placeholder=t.jobPh;
  $("t-drop1").textContent=t.drop1; $("t-drop2").textContent=t.drop2; $("fileclear").textContent=t.clear;
  $("go").textContent=t.go; $("demo").textContent=t.demo; $("t-priv").textContent=t.priv;
  $("tab-check").textContent=t.tabCheck; $("tab-tpl").textContent=t.tabTpl;
  $("t-s3").textContent=t.s3; $("t-opt3").textContent=t.opt3;
  const fill=(el,keep)=>{ const v=el.value||keep; el.innerHTML=Object.entries(t.segs).map(([k,v2])=>`<option value="${k}">${h(v2)}</option>`).join(""); el.value=v||"geral"; };
  fill($("seg"),"geral"); fill($("tseg"),"geral");
  const intl=l==="en";
  $("market").textContent=intl?t.mktIntl:t.mktBr; $("tmarket").textContent=intl?t.mktIntl:t.mktBr;
  $("t-marketnote").textContent=intl?t.mktNoteIntl:t.mktNoteBr;
  $("t-tmarketnote").textContent=intl?t.mktNoteIntl:t.tplMktBr;
  $("t-tplh").textContent=t.tplH; $("t-tseglabel").textContent=t.tplSeg; $("tpl-dl").textContent=t.tplDl; $("tpl-copy").textContent=t.tplCopy; $("t-tipsh").textContent=t.tipsH;
  if(current){
    if(current.demo){ const d=DEMO[l]; $("job").value=d.job; current.doc=JSON.parse(JSON.stringify(d.doc)); current.name=l==="pt"?"curriculo-exemplo.pdf":"sample-resume.pdf"; $("filename").textContent=current.name; }
    result=analyze(current.doc,$("job").value,opts()); aiState="idle"; aiHtmlCache=null;
  }
  if(result) renderResult(); else renderEmpty();
  renderTpl(); renderSug();

function setView(v){
  view=v;
  ["check","tpl","sug"].forEach(k=>{ $("view-"+k).classList.toggle("hidden",v!==k); $("tab-"+k).setAttribute("aria-selected",v===k); });
  if(v==="sug") renderSug();

async function tplDownload(){

function showErr(m){ const e=$("err"); e.textContent=m||""; e.classList.toggle("hidden",!m); }
function renderEmpty(){
  const t=T();
  $("out").innerHTML=`<section class="card empty"><h2>${t.emptyH}</h2><p class="note" style="margin-top:6px;font-size:14px">${t.emptyIntro}</p><ul>${t.emptyList.map(x=>`<li>${x}</li>`).join("")}</ul></section>`;
}
function setFile(name,doc,demo){
  current={doc,name,demo:!!demo}; sugSel=new Set(); result=null; aiState="idle"; aiHtmlCache=null;
  $("filename").textContent=name; $("filechip").classList.add("on"); $("go").disabled=false; showErr("");
}
function clearFile(){ current=null; result=null; $("file").value=""; $("filechip").classList.remove("on"); $("go").disabled=true; renderEmpty(); }

async function handleFile(f){
  showErr("");
  const isPdf=/\.pdf$/i.test(f.name)||f.type==="application/pdf", isDocx=/\.docx$/i.test(f.name);
  if(!isPdf&&!isDocx){ showErr(T().errType); return; }
  if(f.size>8*1024*1024){ showErr(T().errSize); return; }
  $("go").disabled=true; $("go").textContent=T().working;
  try{
    const buf=await f.arrayBuffer();
    const doc=isPdf?await readPdf(buf):await readDocx(buf);
    setFile(f.name,doc,false);
    run();
  }catch(e){
    showErr(e&&e.message==="lib"?T().errLib:T().errRead); $("go").disabled=!current;
  }finally{ $("go").textContent=T().go; }
}
function run(){
  if(!current) return;
  result=analyze(current.doc,$("job").value,opts());
  aiState="idle"; aiHtmlCache=null;
  renderResult();
  $("out").scrollIntoView({behavior:"smooth",block:"start"});
}
const col=s=>s>=80?"var(--good)":s>=60?"var(--warn)":"var(--bad)";
const h=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderResult(){
  const t=T(), r=result, L=o=>h(o[lang]);
  const s=r.overall, C=2*Math.PI*56;
  const verdict=s>=85?["v_good","v_good_p"]:s>=65?["v_mid","v_mid_p"]:["v_bad","v_bad_p"];
  const order={fail:0,warn:1,info:2,pass:3};
  const issues=r.checks.filter(c=>c.status==="fail"||c.status==="warn").sort((a,b)=>order[a.status]-order[b.status]||b.weight-a.weight);
  const oks=r.checks.filter(c=>c.status==="pass");
  const li=c=>`<li class="check ${c.status}"><span class="pill">${t.st[c.status]}</span><div><h3>${L(c.title)}</h3><p>${L(c.detail)}</p>${c.fix?`<p class="fix"><b>${t.fix}:</b> ${L(c.fix)}</p>`:""}</div></li>`;
  const bar=(label,v)=>`<div class="bar"><span>${label}</span><i><b style="width:${v}%;background:${col(v)}"></b></i><span>${v}</span></div>`;
  let kwHtml;
  if(r.kw){
    const f=r.kw.list.filter(x=>x.found), m=r.kw.list.filter(x=>!x.found);
    kwHtml=`<p class="kw-h">${t.kwFound} (${f.length})</p><div class="chips">${f.map(x=>`<span class="chip ok">${h(x.display)}</span>`).join("")||"–"}</div>
      <p class="kw-h">${t.kwMiss} (${m.length})</p><div class="chips">${m.map(x=>`<span class="chip no">${h(x.display)}</span>`).join("")||"–"}</div>
      <p class="note" style="margin-top:12px">${t.kwNote}</p>`;
  } else kwHtml=`<p class="note">${t.noKw}</p>`;
  $("out").innerHTML=`<div class="stack">
  <section class="card">
    ${current.demo?`<p class="note" style="margin-bottom:12px"><span class="demo-tag" style="margin:0 6px 0 0">${t.demoTag}</span>${t.demoNote}</p>`:""}
    <div class="score">
      <div class="ring" role="img" aria-label="${t.overall}: ${s} ${t.of}">
        <svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="66" cy="66" r="56" fill="none" stroke="${col(s)}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-s/100)}"/></svg>
        <div class="num">${s}<small>${t.of}</small></div>
      </div>
      <div class="verdict"><h2>${t[verdict[0]]}</h2><p>${t[verdict[1]]}</p>
        <div class="bars">${bar(t.fmt,r.fmt)}${r.kw?bar(t.match,r.kw.pct):""}</div>
        <p class="note" style="margin-top:12px">${t.scoreNote}</p><p style="margin-top:12px"><button type="button" class="btn" id="to-sug">${t.sugGo}</button></p></div>
    </div>
  </section>
  ${issues.length?`<section class="card"><div class="sec-h"><h2>${t.issues}</h2><span class="count">${issues.length}</span></div><ul class="checks">${issues.map(li).join("")}</ul></section>`:""}
  <section class="card"><div class="sec-h"><h2>${t.kw}</h2>${r.kw?`<span class="count">${r.kw.pct}%</span>`:""}</div>${kwHtml}</section>
  ${oks.length?`<section class="card"><details><summary>${t.okh} (${oks.length})</summary><ul class="checks" style="margin-top:12px">${oks.map(li).join("")}</ul></details></section>`:""}
  <section class="card"><details><summary>${t.raw}</summary><p class="note" style="margin-top:8px">${t.rawNote}</p><pre class="raw">${h(r.text)}</pre></details></section>
  </div>`;
  renderAi();
  $("to-sug").onclick=()=>{ setView("sug"); window.scrollTo({top:0,behavior:"smooth"}); };
}
