<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificador ATS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ats.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="t-title">Verificador ATS</h1>
      <p id="t-sub"></p>
    </div>
    <div class="seg" role="group" aria-label="Idioma / Language">
      <button type="button" id="lang-pt" aria-pressed="true">Português</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-check" aria-selected="true"></button>
    <button type="button" role="tab" id="tab-tpl" aria-selected="false"></button>
    <button type="button" role="tab" id="tab-sug" aria-selected="false"></button>
  </div>

  <div class="grid" id="view-check">
    <aside class="card stack" aria-label="Entrada">
      <div class="step">
        <h2><b>1</b><span id="t-s1"></span></h2>
        <label class="drop" id="drop" for="file">
          <input type="file" id="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
          <strong id="t-drop1"></strong>
          <small id="t-drop2"></small>
        </label>
        <div class="file" id="filechip"><span id="filename"></span><button type="button" class="link" id="fileclear"></button></div>
        <p class="err hidden" id="err" role="alert"></p>
      </div>
      <div class="step">
        <h2><b>2</b><span id="t-s2"></span> <span class="opt" id="t-opt"></span></h2>
        <label for="job" class="note" id="t-joblabel"></label>
        <textarea id="job"></textarea>
      </div>
      <div class="step">
        <h2><b>3</b><span id="t-s3"></span> <span class="opt" id="t-opt3"></span></h2>
        <label for="seg" class="hidden" id="t-seglabel"></label>
        <select id="seg"></select>
        <p class="note"><span class="market" id="market"></span> <span id="t-marketnote"></span></p>
      </div>
      <button type="button" class="btn" id="go" disabled></button>
      <button type="button" class="link" id="demo"></button>
      <p class="note" id="t-priv"></p>
    </aside>

    <main id="out" aria-live="polite"></main>
  </div>

  <div class="tpl-grid hidden" id="view-tpl">
    <aside class="card stack" aria-label="Modelos">
      <div class="step">
        <h2 id="t-tplh"></h2>
        <label for="tseg" class="note" id="t-tseglabel"></label>
        <select id="tseg"></select>
        <p class="note"><span class="market" id="tmarket"></span> <span id="t-tmarketnote"></span></p>
      </div>
      <div class="btn-row"><button type="button" class="btn" id="tpl-dl"></button><button type="button" class="btn ghost" id="tpl-copy"></button></div>
      <p class="err hidden" id="tpl-msg" role="status"></p>
      <div class="step"><h2 id="t-tipsh"></h2><ul class="tips" id="tips"></ul></div>
    </aside>
    <main><div class="paper" id="paper" aria-label="Preview"></div></main>
  </div>

  <div class="tpl-grid hidden" id="view-sug">
    <aside class="card stack" aria-label="Sugestão">
      <div id="sug-side" class="stack"></div>
      <div class="btn-row"><button type="button" class="btn" id="sug-dl"></button><button type="button" class="btn ghost" id="sug-copy"></button></div>
      <p class="err hidden" id="sug-msg" role="status"></p>
    </aside>
    <main><div class="paper" id="sug-paper" aria-label="Preview"></div></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="assets/ats.js"></script>
</body>
</html>
